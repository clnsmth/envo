name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

env:
  AGENT_NAME: clnsmth-ontology-agent
  MODEL: gemini-3.5-flash
  TOOLS_DIR: ${{ github.workspace }}/tools
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}

jobs:
  ai-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ steps.generate-token.outputs.token }}

      - name: Checkout PR branch (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr checkout "${{ env.PR_NUMBER }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config --global user.name "${{ env.AGENT_NAME }}[bot]"
          git config --global user.email "${{ env.AGENT_NAME }}[bot]@users.noreply.github.com"

      - name: Create tools directory
        run: mkdir -p "${{ env.TOOLS_DIR }}"

      - name: Add tools to PATH
        run: echo "${{ env.TOOLS_DIR }}" >> "$GITHUB_PATH"

      - name: Add obo-scripts to PATH
        run: |
          git clone --depth 1 https://github.com/cmungall/obo-scripts.git "${{ env.TOOLS_DIR }}/obo-scripts"
          echo "${{ env.TOOLS_DIR }}/obo-scripts" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python tools
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install aurelian "wrapt>=1.17.2"
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Antigravity CLI Permissions Sandbox
        run: |
          mkdir -p "$HOME/.gemini/antigravity-cli"
          cat <<'EOF' > "$HOME/.gemini/antigravity-cli/settings.json"
          {
            "permissions": {
              "allow": [
                "command(gh)",
                "command(git)",
                "command(obo-grep.pl)",
                "command(aurelian)",
                "command(cat)",
                "command(sed)",
                "command(head)",
                "command(tail)",
                "command(wc)",
                "command(find)",
                "command(ls)",
                "command(rg)",
                "read_file(*)",
                "write_file(*)"
              ],
              "ask": []
            }
          }
          EOF

      - name: Run Antigravity Code Review
        id: review
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PROMPT_CONTENT: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Review this pull request for the ENVO ontology repository.

            Follow the repository instructions in `AGENTS.md`.

            When you need to inspect ontology content in `src/envo/envo-edit.owl`, use ripgrep (`rg`) to search for classes or terms by ID (e.g. `ENVO_NNNNNNNN` with 8 digits):
            - `rg "ENVO_NNNNNNNN" src/envo/envo-edit.owl`

            Focus on:
            - Hierarchy and proposed parents being environmentally and logically consistent
            - Definitions, xrefs, and PMIDs being real and adequately supportive
            - Obsolete-term handling and replacement or consider tags being safe
            - OBO and ODK conventions being preserved
            - Workflow, auth, and repo-configuration regressions when the PR touches `.github` or `.gemini`

            Remember: ENVO term IDs use exactly 8 digits (e.g., `ENVO:01000000`).

            Be constructive and specific. For each issue found, indicate severity:
            - 🔴 CRITICAL: Must fix before merge
            - 🟡 IMPORTANT: Should fix before merge
            - 🔵 SUGGESTION: Optional improvement

            Prefer inline comments for concrete file-level issues. Use the overall review summary to explain the main risks and the merge recommendation.

            After reviewing, set the GitHub PR review status:

            If there are any 🔴 CRITICAL or 🟡 IMPORTANT issues, submit a REQUEST_CHANGES review:
            ```
            gh pr review ${{ env.PR_NUMBER }} --request-changes --body "<your review summary>"
            ```

            If there are only 🔵 SUGGESTIONs or no issues, submit an APPROVE review:
            ```
            gh pr review ${{ env.PR_NUMBER }} --approve --body "<your review summary>"
            ```

            Always include a checklist at the top of your review:
            - [ ] Hierarchy and parents are consistent
            - [ ] Definitions and supporting references look adequate
            - [ ] Obsolete or replacement handling is safe
            - [ ] OBO and ODK conventions appear preserved
            - [ ] No obvious CI, auth, or workflow regression

            SIGNATURE:
            Always include the following signature block in your GitHub review comment:
            ```
            ---
            🤖 **Generated by @${{ env.AGENT_NAME }} (Code Review)**
            - Model: `${{ env.MODEL }}`
            - Agent harness: antigravity-cli
            - Triggered by: @${{ github.event.pull_request.user.login || github.actor }}
            - Run: [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ```
        run: |
          agy --model "${{ env.MODEL }}" -p "$PROMPT_CONTENT"
